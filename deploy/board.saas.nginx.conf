# Moshpit origin for board.saas (installed as /etc/moshpit/templates/board.saas.conf;
# /opt/moshpit/scripts/setup-origin.sh replaces the upper-case placeholder with the name and
# reuses this block on every renewal). The app: github.com/profullstack/board-saas,
# systemd unit board-saas (User=anthony), 127.0.0.1:8826. The front page itself is the
# copy hosted on the c0mpute network; the app fetches it and falls back to its own build.

server {
    listen 80;
    listen [::]:80;
    server_name NAME;
    access_log off;
    error_log  /var/log/nginx/NAME.error.log crit;
    client_max_body_size 300k;

    location / {
        proxy_pass http://127.0.0.1:8826;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name NAME;

    ssl_certificate     /etc/ssl/moshpit/NAME.crt;
    ssl_certificate_key /etc/ssl/moshpit/NAME.key;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_conf_command Groups X25519MLKEM768:X25519:P-256;
    ssl_session_tickets off;
    ssl_session_cache shared:MoshpitSSL:10m;

    access_log off;
    error_log  /var/log/nginx/NAME.error.log crit;
    client_max_body_size 300k;

    location / {
        proxy_pass http://127.0.0.1:8826;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }
}
